name: CI

on:
  push:
    branches: [ github-actions, master ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image (for testing)
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        load: true      
        tags: ghcr.io/${{ github.repository_owner }}/catty-reminders:test

    - name: Run tests inside container
      run: |
        echo "Running tests inside Docker container..."
        
        docker run -d --name catty-test -p 8181:8181 ghcr.io/${{ github.repository_owner }}/catty-reminders:test
        
        sleep 5
        
        docker run --rm --network host ghcr.io/${{ github.repository_owner }}/catty-reminders:test pytest -v || (echo "Tests failed" && exit 1)
        
        docker stop catty-test || true
        echo "Tests passed successfully"

    - name: Build and push Docker image (to GHCR)
      if: success()
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/catty-reminders:latest
          ghcr.io/${{ github.repository_owner }}/catty-reminders:${{ github.sha }}