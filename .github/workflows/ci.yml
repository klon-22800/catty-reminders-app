jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and start services
        run: docker-compose up -d --build

      - name: Run tests inside app container
        run: docker-compose run --rm app pytest -v

      - name: Tear down services
        run: docker-compose down

      - name: Build and push Docker image
        if: success()
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/catty-reminders:latest .
          docker tag ghcr.io/${{ github.repository_owner }}/catty-reminders:latest ghcr.io/${{ github.repository_owner }}/catty-reminders:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/catty-reminders:latest
          docker push ghcr.io/${{ github.repository_owner }}/catty-reminders:${{ github.sha }}