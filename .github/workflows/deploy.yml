name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key

      - name: Deploy full stack via Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -i ~/.ssh/vm_key \
              -p 2449 \
              user@course.prafdin.ru "

            echo 'Pulling latest Docker image...'
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            
            cd ~/Desktop/cat/catty-reminders-app || exit 1
            echo 'Pulling latest app image...'
            docker compose pull app

            echo 'Stopping old stack if exists...'
            docker compose down || true

            echo 'Starting new stack...'
            docker compose up -d

            echo '✅ Deployment completed!'
          "